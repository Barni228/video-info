name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-packager binary
        id: cache-cargo-packager
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/.cargo/bin/cargo-packager.exe' || '~/.cargo/bin/cargo-packager' }}
          key: cargo-packager-bin-${{ runner.os }}-0.11.8

      - name: Install cargo-packager
        if: steps.cache-cargo-packager.outputs.cache-hit != 'true'
        run: cargo install cargo-packager@0.11.8 --locked

      # Bundles a static ffprobe into the package (see `external-binaries` in
      # Cargo.toml) so the app works without ffmpeg installed on the user's
      # machine. cargo-packager expects it at `binaries/ffprobe-<target-triple>`.
      - name: Download ffprobe (macOS, Apple Silicon)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p binaries
          curl -fLo /tmp/ffprobe.zip https://www.osxexperts.net/ffprobe9arm.zip
          unzip -o /tmp/ffprobe.zip -d /tmp/ffprobe
          mv /tmp/ffprobe/ffprobe binaries/ffprobe-aarch64-apple-darwin
          chmod +x binaries/ffprobe-aarch64-apple-darwin
          xattr -cr binaries/ffprobe-aarch64-apple-darwin
          codesign -s - binaries/ffprobe-aarch64-apple-darwin

      - name: Download ffprobe (Windows x64)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p binaries
          curl -fLo /tmp/ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip
          unzip -o /tmp/ffmpeg.zip -d /tmp/ffmpeg
          cp /tmp/ffmpeg/*/bin/ffprobe.exe binaries/ffprobe-x86_64-pc-windows-msvc.exe

      - run: cargo packager --release

      - name: Rename portable Windows binary
        if: matrix.os == 'windows-latest'
        run: mv "target/release/video-info.exe" "target/release/Video Info.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: |
            target/release/*.dmg
            target/release/*.exe
            target/release/*.msi
          if-no-files-found: ignore

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: packages
          pattern: packages-*
          delete-merged: true

  release:
    needs: merge
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
