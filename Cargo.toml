[package]
name = "video-info"
version = "0.1.0"
edition = "2024"

[dependencies]
# unstable-winit-030 gives us access to raw winit window events (WindowEvent::DroppedFile)
# so we can support native OS drag-and-drop of files onto the window.
slint = { version = "1.9", features = ["unstable-winit-030"] }
# os file-picker dialog
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "1.9"

[package.metadata.packager]
product-name = "Video Info"
identifier = "com.barni.videoinfo"
version = "0.1.0"
before-packaging-command = "cargo build --release"
icons = ["icons/512x512.png"]
category = "Utility"

# Registers Video Inspector as an "Open With" option for these video extensions.
# On macOS this becomes CFBundleDocumentTypes in Info.plist.
[[package.metadata.packager.file-associations]]
extensions = [
    "mp4",
    "mkv",
    "mov",
    "avi",
    "webm",
    "m4v",
    "mpg",
    "mpeg",
    "flv",
    "wmv",
]
name = "Video File"
role = "viewer"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
