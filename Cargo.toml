[package]
name = "video-inspector"
version = "0.1.0"
edition = "2021"

[dependencies]
# unstable-winit-030 gives us access to raw winit window events (WindowEvent::DroppedFile)
# so we can support native OS drag-and-drop of files onto the window.
slint = { version = "1.9", features = ["unstable-winit-030"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "1.9"

[package.metadata.packager]
product-name = "Video Inspector"
identifier = "com.barni.videoinspector"
version = "0.1.0"
before-packaging-command = "cargo build --release"
icons = ["icons/256x256.png"]
category = "Utility"

# Registers Video Inspector as an "Open With" option for these video extensions.
# On macOS this becomes CFBundleDocumentTypes in Info.plist.
[[package.metadata.packager.file-associations]]
extensions = [
    "mp4",
    "mkv",
    "mov",
    "avi",
    "webm",
    "m4v",
    "mpg",
    "mpeg",
    "flv",
    "wmv",
]
# name = "Video File"
name = "Video"
role = "viewer"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
