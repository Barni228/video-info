[package]
name = "video-info"
version = "0.6.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# unstable-winit-030 gives us access to raw winit window events (WindowEvent::DroppedFile)
# so we can support native OS drag-and-drop of files onto the window.
slint = { version = "1.17", features = ["unstable-winit-030"] }
# os file-picker dialog
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
copypasta = "0.10"
# Update check: a blocking HTTP client, to match the background-thread
# pattern the ffprobe call already uses. No async runtime involved.
ureq = "3"

[build-dependencies]
slint-build = "1.17"

[package.metadata.packager]
product-name = "Video Info"
identifier = "com.barni.videoinfo"
before-packaging-command = "cargo build --release"
icons = ["icons/512x512.png"]
category = "Utility"

# Bundled ffprobe so the app works without ffmpeg installed. The path here
# omits the `-<target-triple>` suffix; cargo-packager appends it when
# resolving the source file (see CI workflow, which downloads these before
# `cargo packager` runs) and strips it back off when copying into the
# package, placing the binary next to the app's own executable.
external-binaries = ["binaries/ffprobe"]

# Registers Video Inspector as an "Open With" option for these video/audio
# extensions. On macOS this becomes CFBundleDocumentTypes in Info.plist; on
# Windows, file-association registry entries. `file-associations` is a Vec
# under the hood, so multiple `[[...]]` blocks are supported and append to
# it rather than overwrite it -- kept as two blocks (video/audio) so each
# gets its own descriptive `name`.
[[package.metadata.packager.file-associations]]
extensions = [
    "mp4",
    "mkv",
    "mov",
    "avi",
    "webm",
    "m4v",
    "mpg",
    "mpeg",
    "flv",
    "wmv",
    "gif",
]
name = "Video File"
role = "viewer"

[[package.metadata.packager.file-associations]]
extensions = ["mp3", "wav", "flac", "aac", "m4a", "ogg", "opus", "wma", "aiff"]
name = "Audio File"
role = "viewer"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
